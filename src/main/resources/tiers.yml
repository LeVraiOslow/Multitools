# ============================================================
#  MultiTools - paliers
#  L'ordre des paliers dans ce fichier = l'ordre d'évolution.
#  Tu peux renommer, ajouter ou supprimer des paliers librement.
#
#  Placeholders : {tier} {tier_id} {level} {max_level} {progress} {needed}
#                 {remaining} {percent} {total} {next_tier} {bar}
# ============================================================
tiers:
  common:
    name: "&7Commun"
    item-name: "&f&lMultiTools &8» {tier}"
    material: NETHERITE_PICKAXE        # objet de base (sert de fallback visuel)
    # --- Textures ---
    # item-model : modèle d'item (ressource pack / Nexo). Exemple : "nexo:outils/multitool_common"
    item-model: ""
    # nexo-item : id d'un item Nexo utilisé comme base (optionnel, nécessite Nexo)
    nexo-item: ""
    blocks-to-next: 3000               # blocs à casser pour passer au palier suivant
    mining-speed: 9.0                  # vitesse de minage de base de l'outil
    jobs-xp-multiplier: 1.0
    enchantments:                      # clés vanilla ("efficiency") ou custom ("excellentenchants:xxx")
      efficiency: 4
      fortune: 1
      unbreaking: 3
    level-up:
      sound: "entity.player.levelup"
      volume: 1.0
      pitch: 1.0
      commands: []                     # commandes console. ex: ["give {player} diamond 5"]
    lore:
      - "&8Outil évolutif"
      - ""
      - "&7Pelle, hache et pioche en un seul outil."
      - "&7Incassable."
      - ""
      - "&6Palier : {tier} &8(&f{level}&8/&f{max_level}&8)"
      - "&6Progression : &f{progress}&8/&f{needed} &8(&f{percent}%&8)"
      - "{bar}"
      - "&6Blocs cassés : &f{total}"
      - "&6Prochain palier : {next_tier}"

